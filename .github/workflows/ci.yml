# GitHub-owned actions only, pinned to full commit SHAs. No third-party actions,
# no pull_request_target, no secrets: the E2E suite is hermetic.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: No unfilled placeholders
        # Exit 0 when clean; exit 1 on placeholders or scan failure.
        # grep exit 1 = no matches. Any other non-zero grep exit is a scan
        # failure and must propagate.
        run: |
          if grep -rEn --include='*.md' --exclude-dir=.git '[{][{]' .; then
            echo "Unfilled template placeholders found" >&2; exit 1
          else
            code=$?; [ "$code" -eq 1 ] || { echo "Placeholder scan failed (grep exit $code)" >&2; exit 1; }
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./... && go vet -tags e2e ./e2e
      - name: Unit and integration tests
        run: go test -count=1 ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Hermetic E2E suite
        run: make e2e
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            e2e/out/report.json
            e2e/out/compose.log
          if-no-files-found: warn

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Multi-arch image build (no emulation)
        run: |
          docker buildx create --use --name nordtail
          docker buildx build --platform linux/amd64,linux/arm64 .
